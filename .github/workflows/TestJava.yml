name: Java CI - Run unit tests

# Run the tests every time code is pushed or a pull request is opened
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # Runs every test class in src/test: LoginTest (Part 1), MessageTest (Part 2)
      # and StoredMessagesTest (Part 3). Maven also downloads Gson for the JSON reader.
      - name: Run all unit tests (Parts 1 to 3) with Maven
        run: mvn --batch-mode test