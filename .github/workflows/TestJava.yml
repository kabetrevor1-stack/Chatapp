name: Java CI - Run unit tests

# Run the tests every time code is pushed or a pull request is opened
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # Runs every test class, so LoginTest and MessageTest both run
      - name: Run unit tests with Maven
        run: mvn --batch-mode test
